      .toc ol { margin: 0; padding-left: 1.4em; columns: 2; column-gap: 32px; font: 15px/1.9 var(--mono); }

      .reference-group { margin: 0 0 30px; }

      .reference-group ul { margin: 0; padding: 0; list-style: none; }

      .reference-group a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
      .article-footer { padding: 32px 0 0; color: var(--muted); border-top: 1px solid var(--rule); font: 12px/1.8 var(--mono); }
      .insight-list li { margin-bottom: 12px; }

      /* ---------- figure parts specific to this post (light only) ---------- */
      .c12-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; font: 11.5px/1.4 var(--mono); color: var(--ink-soft); }
      .c12-legend i { display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; }
      .c12-tip { min-height: 2.6em; margin: 6px 0 0; font: 11.5px/1.5 var(--mono); color: var(--ink-soft); }
      .c12-tip b { color: var(--ink); }
      .c12-select { max-width: 100%; padding: 4px 6px; color: var(--ink); background: #fbfaf8; border: 1px solid var(--rule); border-radius: 3px; font: 12px/1.3 var(--mono); }
      .c12-btn { padding: 4px 9px; color: var(--ink); background: #fbfaf8; border: 1px solid var(--rule); border-radius: 3px; font: 11.5px/1.4 var(--mono); cursor: pointer; }
      .c12-btn[aria-pressed="true"] { color: #fff; background: #0b5ea8; border-color: #0b5ea8; }
      .c12-btn:focus-visible, .c12-cell:focus-visible, .c12-chip:focus-visible { outline: 2px solid #d66f00; outline-offset: 2px; }
      #grp-cells { display: flex; flex-wrap: wrap; gap: 6px; }
      .c12-cell { display: flex; flex-direction: column; align-items: center; width: 46px; padding: 4px 0; color: var(--ink); background: #fbfaf8; border: 1px solid var(--rule); border-radius: 3px; font: 11px/1.3 var(--mono); cursor: pointer; }
      .c12-cell b { font-size: 14px; }
      .c12-cell.is-win { background: rgba(47, 143, 91, 0.18); border-color: #2f8f5b; }
      .c12-cell.is-mid { background: rgba(47, 143, 91, 0.08); border-color: #2f8f5b; }
      #grp-bars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .c12-advbar { position: relative; width: 46px; display: flex; flex-direction: column; align-items: center; font: 10.5px/1.3 var(--mono); }
      .c12-advbar__up { display: flex; align-items: flex-end; height: 64px; }
      .c12-advbar__up i { display: block; width: 26px; background: #0b5ea8; border-radius: 2px 2px 0 0; }
      .c12-advbar__down { display: block; height: 64px; border-top: 1px solid #7b8388; width: 100%; text-align: center; }
      .c12-advbar__down i { display: block; width: 26px; margin: 0 auto; background: #d66f00; border-radius: 0 0 2px 2px; }
      .c12-advbar em { font-style: normal; color: var(--ink); }
      #rp-members { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
      .c12-chip { padding: 3px 7px; color: var(--ink); background: #fbfaf8; border: 1px solid var(--rule); border-radius: 3px; font: 11px/1.3 var(--mono); cursor: pointer; }
      .c12-chip.is-win { border-color: #2f8f5b; }
      .c12-chip.is-lose { border-color: #d66f00; }
      .c12-chip[aria-pressed="true"] { color: #fff; background: #14171a; border-color: #14171a; }
      .c12-step { display: grid; grid-template-columns: minmax(0, 1fr) 54px 120px; gap: 8px; align-items: center; padding: 5px 7px; border-top: 1px solid #dedad2; font: 11.5px/1.35 var(--mono); }
      .c12-step.is-current { background: rgba(214, 111, 0, 0.09); }
      .c12-step.is-future { opacity: 0.45; }
      .c12-step__t code { display: block; color: #0b5ea8; font: inherit; font-weight: 600; overflow-wrap: anywhere; background: none; padding: 0; }
      .c12-step__t span { display: block; color: var(--ink-soft); overflow-wrap: anywhere; }
      .c12-step__t span.is-err { color: #b8432f; }
      .c12-step__v { color: var(--muted); }
      .c12-step__bar { position: relative; height: 22px; background: linear-gradient(#cac6bd, #cac6bd) center / 1px 100% no-repeat; }
      .c12-step__bar i { position: absolute; top: 4px; height: 14px; border-radius: 2px; }
      .c12-step__bar em { position: absolute; top: 3px; right: 0; color: var(--ink); font-style: normal; font-size: 10.5px; }
      .series-chain { margin: 22px 0; padding: 16px 18px; background: var(--paper-bright); border: 1px solid var(--rule); list-style: none; font: 14px/1.5 var(--mono); }
      .series-chain li { position: relative; margin: 0; padding: 7px 0 7px 22px; }
      .series-chain li::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: var(--rule); }
      .series-chain li::after { content: ""; position: absolute; left: 3px; top: 16px; width: 7px; height: 7px; background: #0b5ea8; border-radius: 50%; }
      .series-chain span { display: block; color: var(--muted); font-size: 11.5px; }

      @media (max-width: 640px) {
        .article-wrap { width: calc(100% - 32px); }
        .article-content { width: calc(100% - 32px); }
        .toc ol { columns: 1; }
        .c12-step { grid-template-columns: minmax(0, 1fr) 90px; }
        .c12-step__v { display: none; }
      }
